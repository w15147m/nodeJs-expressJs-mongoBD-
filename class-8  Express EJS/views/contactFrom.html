<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4 font-sans text-slate-800">
  <main class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center">
    <h1 class="text-2xl font-bold text-slate-900 mb-2">Contact</h1>
    <p class="text-slate-500 text-sm mb-6">Send me a message</p>
    <form method="POST" action="/contact" class="space-y-4 text-left">
      <div>
        <label for="name" class="block text-xs font-semibold uppercase text-slate-600 mb-1.5">Your name</label>
        <input id="name" type="text" name="name" placeholder="Jane Doe" required
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
      </div>
      <div>
        <label for="message" class="block text-xs font-semibold uppercase text-slate-600 mb-1.5">Your message</label>
        <textarea id="message" name="message" placeholder="Write your message here..." rows="4" required
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-200 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"></textarea>
      </div>
      <button type="submit"
        class="w-full py-2.5 px-4 rounded-lg bg-blue-600 text-white font-medium text-sm hover:bg-blue-700 transition">Send</button>
    </form>
    <div class="mt-4">
      <a href="/" class="text-xs text-slate-500 hover:text-slate-800 transition">Back home</a>
    </div>
  </main>
</body>
</html>
